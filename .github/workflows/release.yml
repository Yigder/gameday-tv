# Builds the signed APK and publishes it as a GitHub release (what the Downloader code installs).
#
# Run it from Actions › Release › Run workflow (or push a tag like v2.4.0). It needs these
# repository secrets (Settings › Secrets and variables › Actions), the same key that signed
# earlier releases — an APK signed with any other key won't install over them:
#   KEYSTORE_BASE64     the keystore file, base64-encoded
#   KEYSTORE_PASSWORD   its store password
#   KEY_ALIAS           the key alias
#   KEY_PASSWORD        the key password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-37"

      - name: Set up the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the real key the build would be debug-signed, which can't update existing installs.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/signing/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/keystore.properties"

      - name: Build
        run: ./gradlew assembleRelease -PgamedayKeystore="$RUNNER_TEMP/signing/keystore.properties" --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v$version"
          major_minor=$(echo "$version" | cut -d. -f1,2)
          cp app/build/outputs/apk/release/app-release.apk GameDayTV.apk
          notes=".github/release-notes/$tag.md"
          [ -f "$notes" ] || { echo "Release $tag" > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" GameDayTV.apk --clobber
          else
            gh release create "$tag" GameDayTV.apk --target "$GITHUB_SHA" --title "GameDay TV $major_minor" --notes-file "$notes" --latest
          fi
